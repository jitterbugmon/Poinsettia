name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      installer_mode:
        description: "Use unsigned beta for a private test artifact, or signed for an Authenticode-verified artifact"
        type: choice
        required: true
        default: unsigned-beta
        options:
          - unsigned-beta
          - signed

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          py -3.11 -m venv .venv-windows
          .\.venv-windows\Scripts\python.exe -m pip install --upgrade pip
          .\.venv-windows\Scripts\python.exe -m pip install -r windows_release\requirements.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        env:
          POINSETTIA_OLLAMA_INSTALLER_URL: ${{ vars.POINSETTIA_OLLAMA_INSTALLER_URL }}
          POINSETTIA_OLLAMA_SHA256: ${{ secrets.POINSETTIA_OLLAMA_SHA256 }}
          POINSETTIA_SIGNING_CERTIFICATE_THUMBPRINT: ${{ vars.POINSETTIA_SIGNING_CERTIFICATE_THUMBPRINT }}
          POINSETTIA_RELEASE_REF_NAME: ${{ github.ref_name }}
          POINSETTIA_RELEASE_REF_TYPE: ${{ github.ref_type }}
          POINSETTIA_INSTALLER_MODE: ${{ github.event.inputs.installer_mode || 'unsigned-beta' }}
        run: |
          $refName = $env:POINSETTIA_RELEASE_REF_NAME
          $refType = $env:POINSETTIA_RELEASE_REF_TYPE
          $installerMode = $env:POINSETTIA_INSTALLER_MODE
          if ($installerMode -notin @("unsigned-beta", "signed")) {
            throw "Installer mode must be unsigned-beta or signed."
          }
          $version = "4.0.0.0"
          if ($refType -eq "tag") {
            if (!$refName.StartsWith("v")) {
              throw "Release tags must start with v."
            }
            $version = $refName.Substring(1)
          }
          $isTagBuild = $refType -eq "tag"
          $isUnsignedBeta = !$isTagBuild -and $installerMode -eq "unsigned-beta"
          if ($isUnsignedBeta) {
            Write-Host "Building an unsigned beta artifact; clearing the signing thumbprint for this branch/manual run."
            $env:POINSETTIA_SIGNING_CERTIFICATE_THUMBPRINT = ""
          }
          $requireSignature = $isTagBuild -or $installerMode -eq "signed"
          $buildParameters = @{
            PackageVersion = $version
            CreateInstaller = $true
            RequireSignature = $requireSignature
          }
          .\windows_release\tools\build_release.ps1 @buildParameters

      - name: Verify signed installer signature
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.installer_mode == 'signed'
        shell: pwsh
        env:
          POINSETTIA_SIGNING_CERTIFICATE_THUMBPRINT: ${{ vars.POINSETTIA_SIGNING_CERTIFICATE_THUMBPRINT }}
          POINSETTIA_INSTALLER_MODE: ${{ github.event.inputs.installer_mode || 'unsigned-beta' }}
        run: |
          if (!$env:POINSETTIA_SIGNING_CERTIFICATE_THUMBPRINT) {
            throw "Set the POINSETTIA_SIGNING_CERTIFICATE_THUMBPRINT repository variable before a signed build."
          }
          $expectedThumbprint = $env:POINSETTIA_SIGNING_CERTIFICATE_THUMBPRINT -replace "\s", ""
          $installerFiles = @(Get-ChildItem windows_release\build\installer -File -Filter "*.exe")
          if ($installerFiles.Count -ne 1) {
            throw "Expected exactly one signed installer executable; found $($installerFiles.Count)."
          }
          foreach ($installer in $installerFiles) {
            $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Installer Authenticode verification failed for $($installer.Name) (status: $($signature.Status); $($signature.StatusMessage))."
            }
            $actualThumbprint = $signature.SignerCertificate.Thumbprint -replace "\s", ""
            if ($actualThumbprint -ne $expectedThumbprint) {
              throw "Installer signer thumbprint does not match POINSETTIA_SIGNING_CERTIFICATE_THUMBPRINT."
            }
          }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-FileHash windows_release\build\installer\*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content windows_release\build\installer\SHA256SUMS.txt -Encoding ascii

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: poinsettia-windows-installer-${{ github.ref_type == 'tag' && 'signed-tag' || inputs.installer_mode == 'signed' && 'signed-manual' || 'unsigned-beta' }}
          path: windows_release/build/installer/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            windows_release/build/installer/*.exe
            windows_release/build/installer/SHA256SUMS.txt
